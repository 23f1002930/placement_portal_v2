<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placement Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/frontend/style.css" rel="stylesheet"></head>
<body><div id="app">
<nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="#">Placement Portal</a><div v-if="user" class="d-flex align-items-center gap-3 text-white"><button class="btn btn-sm btn-light" @click="page='notifications';loadNotifications()">Notifications</button><span>{{user.username}} · {{user.role}}</span><button class="btn btn-sm btn-outline-light" @click="logout">Logout</button></div></div></nav>
<main class="container py-4"><div v-if="alert" :class="'alert alert-'+alert.type">{{alert.text}}</div><div v-if="loading" class="text-center py-5"><div class="spinner-border text-primary"></div><p>Loading…</p></div>

<template v-else-if="!user"><div class="row justify-content-center"><div class="col-lg-5"><div class="card shadow-sm border-0"><div class="card-body p-4">
<h1 class="h3 mb-3">{{authMode==='login'?'Welcome back':authMode==='student'?'Student registration':'Company registration'}}</h1>
<form @submit.prevent="submitAuth"><input v-model="form.username" autocomplete="username" class="form-control mb-2" placeholder="Username" required><input v-if="authMode!=='login'" v-model="form.email" type="email" autocomplete="email" class="form-control mb-2" placeholder="Email" required><input v-model="form.password" type="password" :autocomplete="authMode==='login'?'current-password':'new-password'" class="form-control mb-2" placeholder="Password" required>
<template v-if="authMode==='student'"><input v-model="form.full_name" class="form-control mb-2" placeholder="Full name" required><input v-model="form.register_number" class="form-control mb-2" placeholder="Register number" required><input v-model="form.department" class="form-control mb-2" placeholder="Department" required><div class="row"><div class="col"><input v-model.number="form.year" type="number" class="form-control mb-2" placeholder="Year" required></div><div class="col"><input v-model.number="form.cgpa" type="number" step=".01" class="form-control mb-2" placeholder="CGPA" required></div></div></template>
<template v-if="authMode==='company'"><input v-model="form.company_name" class="form-control mb-2" placeholder="Company name" required><input v-model="form.hr_name" class="form-control mb-2" placeholder="HR name" required><input v-model="form.hr_email" type="email" class="form-control mb-2" placeholder="HR email" required></template><button class="btn btn-primary w-100">Continue</button></form>
<div class="mt-3 text-center"><button class="btn btn-link" @click="authMode='login';form={}">Login</button><button class="btn btn-link" @click="authMode='student';form={}">Student register</button><button class="btn btn-link" @click="authMode='company';form={}">Company register</button></div></div></div></div></div></template>

<template v-else><div class="d-flex gap-2 flex-wrap mb-4"><button class="btn btn-outline-primary" @click="dashboard">Dashboard</button><button v-if="user.role==='ADMIN'" class="btn btn-outline-primary" @click="loadAdmin('companies')">Companies</button><button v-if="user.role==='ADMIN'" class="btn btn-outline-primary" @click="loadAdmin('students')">Students</button><button v-if="user.role==='ADMIN'" class="btn btn-outline-primary" @click="loadAdmin('drives')">Drives</button><button v-if="user.role==='ADMIN'" class="btn btn-outline-primary" @click="loadAdmin('applications')">Applications</button><button v-if="user.role==='ADMIN'" class="btn btn-outline-primary" @click="loadReports">Reports</button><button v-if="user.role==='COMPANY'" class="btn btn-outline-primary" @click="loadCompanyDrives">My drives</button><button v-if="user.role==='COMPANY'" class="btn btn-outline-primary" @click="loadProfile">Profile</button><button v-if="user.role==='STUDENT'" class="btn btn-outline-primary" @click="loadDrives">Browse drives</button><button v-if="user.role==='STUDENT'" class="btn btn-outline-primary" @click="loadApplications">Applications</button><button v-if="user.role==='STUDENT'" class="btn btn-outline-primary" @click="loadHistory">Placement history</button><button v-if="user.role==='STUDENT'" class="btn btn-outline-primary" @click="loadProfile">Profile</button></div>

<section v-if="page==='dashboard'"><h2 class="mb-3">Dashboard</h2><div class="row g-3"><div v-for="(v,k) in data" :key="k" class="col-sm-6 col-lg-3"><div class="card border-0 shadow-sm h-100"><div class="card-body"><div class="text-muted text-capitalize">{{k.replaceAll('_',' ')}}</div><div class="display-6 fw-semibold">{{v}}</div></div></div></div></div></section>

<section v-else-if="['companies','students','admin-drives','admin-applications'].includes(page)"><div class="d-flex justify-content-between"><h2 class="text-capitalize">{{page.replace('admin-','')}}</h2><input v-model="search" @input="searchAdmin" class="form-control w-auto" placeholder="Search"></div><div class="table-responsive mt-3"><table class="table table-hover align-middle"><thead><tr><th>Name</th><th>Status / Details</th><th>Actions</th></tr></thead><tbody><tr v-for="x in items"><td>{{x.company_name||x.full_name||x.job_title||x.student}}</td><td><span :class="badge(x.approval_status||x.status)">{{x.approval_status||x.status||x.department}}</span><span v-if="x.company && page==='admin-applications'"> · {{x.company}}</span></td><td><template v-if="page==='companies'"><button class="btn btn-sm btn-success me-1" @click="adminAction('companies',x.company_id,'approve')">Approve</button><button class="btn btn-sm btn-danger me-1" @click="confirmAction('companies',x.company_id,'reject')">Reject</button><button class="btn btn-sm btn-dark me-1" @click="confirmAction('companies',x.company_id,'blacklist')">Blacklist</button><button class="btn btn-sm btn-outline-danger me-1" @click="confirmAction('companies',x.company_id,'deactivate')">Deactivate</button><button class="btn btn-sm btn-outline-success" @click="adminAction('companies',x.company_id,'activate')">Activate</button></template><template v-if="page==='students'"><button class="btn btn-sm btn-dark me-1" @click="confirmAction('students',x.student_id,'blacklist')">Blacklist</button><button class="btn btn-sm btn-outline-danger me-1" @click="confirmAction('students',x.student_id,'deactivate')">Deactivate</button><button class="btn btn-sm btn-outline-success" @click="adminAction('students',x.student_id,'activate')">Activate</button></template><template v-if="page==='admin-drives'"><button class="btn btn-sm btn-success me-1" @click="adminAction('drives',x.id,'approve')">Approve</button><button class="btn btn-sm btn-danger me-1" @click="confirmAction('drives',x.id,'reject')">Reject</button><button class="btn btn-sm btn-secondary" @click="confirmAction('drives',x.id,'close')">Close</button></template></td></tr><tr v-if="!items.length"><td colspan="3" class="text-center text-muted">No records found.</td></tr></tbody></table></div></section>

<section v-else-if="page==='drives'"><div class="d-flex justify-content-between mb-3"><h2>Placement drives</h2><input v-model="search" @input="loadDrives" class="form-control w-auto" placeholder="Search drives"></div><div class="row g-3"><div v-for="d in items" class="col-lg-6"><div class="card h-100 shadow-sm border-0"><div class="card-body"><div class="d-flex justify-content-between"><h3 class="h5">{{d.job_title}}</h3><span :class="badge(d.status)">{{d.status}}</span></div><p class="text-muted">{{d.company}}</p><p>{{d.job_description}}</p><p class="small">CGPA ≥ {{d.minimum_cgpa}} · {{d.eligible_department}} · Year {{d.eligible_year}}</p><div v-if="!d.eligible" class="alert alert-warning py-2">{{d.eligibility_reasons.join(', ')}}</div><button class="btn btn-primary" :disabled="!d.eligible" @click="apply(d.id)">Apply</button></div></div></div><p v-if="!items.length" class="text-muted">No approved drives available.</p></div></section>

<section v-else-if="page==='company-drives'"><div class="d-flex justify-content-between"><h2>My drives</h2><button class="btn btn-primary" @click="showCreate=!showCreate">Create drive</button></div><form v-if="showCreate" @submit.prevent="createDrive" class="card card-body my-3"><div class="row g-2"><div class="col-md-6"><input v-model="form.job_title" class="form-control" placeholder="Job title" required></div><div class="col-md-6"><input v-model="form.eligible_department" class="form-control" placeholder="Department or ALL"></div><div class="col-12"><textarea v-model="form.job_description" class="form-control" placeholder="Description" required></textarea></div><div class="col-md-3"><input v-model.number="form.minimum_cgpa" type="number" step=".1" class="form-control" placeholder="Minimum CGPA"></div><div class="col-md-3"><input v-model.number="form.eligible_year" type="number" class="form-control" placeholder="Year" required></div><div class="col-md-3"><input v-model="form.application_deadline" type="datetime-local" class="form-control" required></div><div class="col-md-3"><input v-model="form.drive_date" type="datetime-local" class="form-control" required></div></div><button class="btn btn-success mt-3">Submit for approval</button></form><table class="table mt-3"><thead><tr><th>Job</th><th>Status</th><th>Applicants</th><th>Action</th></tr></thead><tbody><tr v-for="d in items"><td>{{d.job_title}}</td><td><span :class="badge(d.status)">{{d.status}}</span></td><td>{{d.applicant_count}}</td><td><button class="btn btn-sm btn-outline-primary" @click="loadCompanyApplications(d.id)">Applications</button></td></tr><tr v-if="!items.length"><td colspan="4">No drives yet.</td></tr></tbody></table></section>

<section v-else-if="page==='applications'||page==='history'"><div class="d-flex justify-content-between"><h2>{{page==='history'?'Placement history':'Applications'}}</h2><button class="btn btn-outline-success" @click="exportCsv">Export CSV</button></div><table class="table mt-3"><thead><tr><th>Company</th><th>Job</th><th>Status</th><th>Interview</th></tr></thead><tbody><tr v-for="a in items"><td>{{a.company}}</td><td>{{a.job_title}}</td><td><span :class="badge(a.status)">{{a.status}}</span></td><td>{{a.interview_date||'—'}}</td></tr><tr v-if="!items.length"><td colspan="4">No applications found.</td></tr></tbody></table></section>

<section v-else-if="page==='company-applications'"><h2>Drive applications</h2><table class="table mt-3"><thead><tr><th>Student</th><th>Register no.</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr v-for="a in items"><td>{{a.student}}</td><td>{{a.register_number}}</td><td><span :class="badge(a.status)">{{a.status}}</span></td><td><button class="btn btn-sm btn-info me-1" @click="applicationAction(a.id,'shortlist')">Shortlist</button><button class="btn btn-sm btn-warning me-1" @click="scheduleInterview(a.id)">Interview</button><button class="btn btn-sm btn-success me-1" @click="applicationAction(a.id,'select')">Select</button><button class="btn btn-sm btn-danger me-1" @click="confirmApplication(a.id,'reject')">Reject</button><button v-if="a.status==='SELECTED'" class="btn btn-sm btn-outline-success" @click="offerLetter(a.id)">Generate Offer Letter</button></td></tr><tr v-if="!items.length"><td colspan="4">No applications yet.</td></tr></tbody></table></section>

<section v-else-if="page==='profile'"><h2>Profile</h2><form @submit.prevent="saveProfile" class="card card-body shadow-sm"><div class="row g-3"><div v-for="key in editableProfile" :key="key" class="col-md-6"><label class="form-label text-capitalize">{{key.replaceAll('_',' ')}}</label><input v-model="profile[key]" :type="key==='cgpa'||key==='year'?'number':'text'" class="form-control"></div></div><button class="btn btn-primary mt-3">Save profile</button></form><form v-if="user.role==='STUDENT'" @submit.prevent="uploadResume" class="card card-body mt-3"><label class="form-label">Resume (PDF, maximum 5 MB)</label><input ref="resume" type="file" accept="application/pdf" class="form-control" required><button class="btn btn-outline-primary mt-2">Upload resume</button></form></section>

<section v-else-if="page==='reports'"><h2>Placement reports</h2><div class="row g-3"><div v-for="(value,key) in report.applications_by_status" class="col-md-3"><div class="card card-body"><span class="text-muted">{{key}}</span><strong class="h3">{{value}}</strong></div></div></div><div class="alert alert-primary mt-3">Placement rate: {{report.placement_rate}}%</div></section>
<section v-else-if="page==='notifications'"><h2>Notifications</h2><div v-for="n in items" class="alert" :class="n.is_read?'alert-light':'alert-info'"><strong>{{n.title}}</strong><br>{{n.message}} <button v-if="!n.is_read" class="btn btn-sm btn-link" @click="readNotification(n.id)">Mark read</button></div><p v-if="!items.length">No notifications.</p></section>
</template></main></div><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="/frontend/app.js"></script></body></html>
